# Atlas · 云端构建文档站并发布到 GitHub Pages
#
# 本仓库是上游项目的文档站镜像。构建完全在 GitHub Actions 中完成,
# 只需定时(或手动)触发,失败也不会影响上游仓库。
name: Atlas · docs site

on:
  schedule:
    - cron: "37 4 * * 1"
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atlas-docs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install toolchain
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material mkdocs-minify-plugin
          pip install -r requirements-docs.txt || pip install -r docs/requirements.txt || true
      - name: Sanitize mkdocs config
        run: |
          CFG=mkdocs.yml; [ -f "$CFG" ] || CFG=mkdocs.yaml
          python - "$CFG" <<'PY'
          import re, sys
          path = sys.argv[1]
          lines = open(path, encoding="utf-8").read().splitlines()
          out, skip = [], False
          for line in lines:
              if re.match(r'^(site_url|repo_url|repo_name|edit_uri|plugins|markdown_extensions|watch|extra_css|extra_javascript|hooks)\s*:', line):
                  skip = True
                  continue
              if skip:
                  if re.match(r'^\S', line) and line.strip():
                      skip = False
                  else:
                      continue
              out.append(line)
          out += ["plugins: []", "markdown_extensions: []", "use_directory_urls: true"]
          open(path, "w", encoding="utf-8").write("\n".join(out) + "\n")
          PY
          sed -n '1,40p' "$CFG"
      - name: Build
        run: mkdocs build -d site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
